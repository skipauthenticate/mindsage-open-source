# MindSage Full Stack Docker Compose

services:
  frontend:
    build:
      context: ./mindsage-frontend
      dockerfile: Dockerfile
    container_name: mindsage-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mindsage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  mindsage:
    build:
      context: ./mindsage
      dockerfile: Dockerfile
    container_name: mindsage
    restart: unless-stopped
    ports:
      - "3003:3003"
      - "53317:53317"
      - "6080:6080"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DEVICE_NAME=MindSage
      - VECTOR_STORE_HOST=vector-store
      - VECTOR_STORE_PORT=8085
    volumes:
      - ./mindsage/data:/app/data
    depends_on:
      vector-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  vector-store:
    build:
      context: ./mindsage/vector-store
      dockerfile: Dockerfile
      args:
        DOWNLOAD_MODELS: "false"
    container_name: mindsage-vector-store
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      # Set both values to expose authenticated remote MCP through a tunnel/proxy.
      # - MCP_VECTOR_STORE_PUBLIC=true
      # - VECTOR_STORE_API_KEY=${VECTOR_STORE_API_KEY}
      - PII_ENTITIES=strict
      - LPRAG_MODE=hybrid
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256
      - AUDIO_PII_ENABLED=true
      - AUDIO_PII_REDACTION_STYLE=lprag
      - IMAGE_PII_ENABLED=true
      - IMAGE_PII_OCR_ENGINE=easyocr
      - IMAGE_REDACTION_COLOR=black
    volumes:
      - ./mindsage/data/vectordb:/app/data/vectordb
      - ./mindsage/data/uploads:/app/data/uploads
      - ./mindsage/data/redacted:/app/data/redacted
      - ./mindsage/vector-store/models:/app/models
      - ./mindsage/vector-store/tests/fixtures:/app/tests/fixtures
      - huggingface-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

volumes:
  huggingface-cache:
